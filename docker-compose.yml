# ============================================================
# Docker Compose MobiTranz
# Description : Orchestration des services
# ============================================================

version: '3.8'

services:
  # Backend FastAPI
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mobitranz-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://mobitranz:mobitranz@db:5432/mobitranz
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-changeme-secret-key}
      - JWT_SECRET=${JWT_SECRET:-changeme-jwt-secret}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mobitranz-network
    volumes:
      - ./logs:/app/logs

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: mobitranz-db
    environment:
      - POSTGRES_USER=mobitranz
      - POSTGRES_PASSWORD=mobitranz
      - POSTGRES_DB=mobitranz
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mobitranz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - mobitranz-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: mobitranz-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - mobitranz-network

  # Admin Desktop (optional)
  desktop-admin:
    build:
      context: .
      dockerfile: Dockerfile.desktop
    container_name: mobitranz-desktop
    ports:
      - "8001:8001"
    depends_on:
      - backend
    networks:
      - mobitranz-network

volumes:
  pgdata:
  redisdata:

networks:
  mobitranz-network:
    driver: bridge