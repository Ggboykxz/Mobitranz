# ============================================================
# Docker Compose MobiTranz
# Fichier : docker-compose.yml
# Description : Infrastructure complète (PostgreSQL + Redis + MinIO + API)
# ============================================================

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mobitranz-postgres
    environment:
      POSTGRES_DB: mobitranz
      POSTGRES_USER: mobitranz
      POSTGRES_PASSWORD: mobitranz_dev_password
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mobitranz -d mobitranz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mobitranz

  redis:
    image: redis:7-alpine
    container_name: mobitranz-redis
    command: redis-server --save 60 1 --loglevel warning --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mobitranz

  minio:
    image: minio/minio
    container_name: mobitranz-minio
    environment:
      MINIO_ROOT_USER: mobitranz
      MINIO_ROOT_PASSWORD: mobitranz_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - mobitranz

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mobitranz-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://mobitranz:mobitranz_dev_password@postgres:5432/mobitranz
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: mobitranz_dev_secret_change_in_production
      DEBUG: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - mobitranz

  nginx:
    image: nginx:alpine
    container_name: mobitranz-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - mobitranz

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  mobitranz:
    driver: bridge