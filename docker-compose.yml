# ============================================================
# Docker Compose MobiTranz
# Fichier : docker-compose.yml
# Description : PostgreSQL + Redis + MinIO pour le développement local
# ============================================================

version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: mobitranz-postgres
    environment:
      POSTGRES_DB: mobitranz
      POSTGRES_USER: mobitranz
      POSTGRES_PASSWORD: mobitranz_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mobitranz"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mobitranz-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: mobitranz-minio
    environment:
      MINIO_ROOT_USER: mobitranz
      MINIO_ROOT_PASSWORD: mobitranz_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  minio_data: