# ============================================================
# MobiTranz - Docker Compose Production
# ============================================================

version: '3.8'

services:
  # ============================================================
  # Backend API - FastAPI
  # ============================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: mobitranz-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.production
    environment:
      - ENVIRONMENT=production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - mobitranz-network
    volumes:
      - ./logs:/app/logs
      - uploads:/app/uploads

  # ============================================================
  # Admin Panel - PHP
  # ============================================================
  admin:
    image: php:8.4-apache
    container_name: mobitranz-admin
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./php_admin:/var/www/html
    environment:
      - API_BASE_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - mobitranz-network

  # ============================================================
  # PostgreSQL Database
  # ============================================================
  db:
    image: postgres:15-alpine
    container_name: mobitranz-db
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - POSTGRES_USER=mobitranz
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=mobitranz
      - POSTGRES_MAX_CONNECTIONS=200
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mobitranz -d mobitranz"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
    networks:
      - mobitranz-network
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=512MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100

  # ============================================================
  # Redis Cache & Sessions
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: mobitranz-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    networks:
      - mobitranz-network

  # ============================================================
  # Nginx Reverse Proxy
  # ============================================================
  nginx:
    image: nginx:alpine
    container_name: mobitranz-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - backend
      - admin
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - mobitranz-network

  # ============================================================
  # Prometheus - Metrics
  # ============================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: mobitranz-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - mobitranz-network

  # ============================================================
  # Grafana - Dashboards
  # ============================================================
  grafana:
    image: grafana/grafana:latest
    container_name: mobitranz-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - mobitranz-network

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  uploads:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  mobitranz-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16